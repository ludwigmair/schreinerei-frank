<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Foto">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5636"/><stop offset="1" stop-color="#4f3722"/>
    </linearGradient>
    <pattern id="grain" width="14" height="300" patternUnits="userSpaceOnUse">
      <rect width="14" height="300" fill="url(#g)"/>
      <rect x="0" width="2" height="300" fill="#000" opacity="0.05"/>
      <rect x="7" width="1" height="300" fill="#fff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#grain)"/>
  <rect width="300" height="300" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="2"/>
  <text x="150.0" y="286" text-anchor="middle" font-family="Fira Sans, Arial, sans-serif"
        font-size="14" fill="#fff" fill-opacity="0.9" letter-spacing="1">Foto</text>
</svg>
