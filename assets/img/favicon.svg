<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Schreinerei Frank">
  <title>Schreinerei Frank</title>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6b4e"/>
      <stop offset="1" stop-color="#1f3a28"/>
    </linearGradient>
    <pattern id="grain" width="10" height="120" patternUnits="userSpaceOnUse">
      <rect width="10" height="120" fill="url(#wood)"/>
      <rect x="0" width="1.5" height="120" fill="#000" opacity="0.06"/>
      <rect x="5" width="1" height="120" fill="#fff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="url(#grain)"/>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="none" stroke="#2C5138" stroke-width="3"/>
  <text x="60" y="82" text-anchor="middle" font-family="Fira Sans, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#ffffff" letter-spacing="2">SF</text>
</svg>
