# Netlify-Konfiguration – Build + Auslieferung.
# Reicht aus: Repo bei Netlify verbinden, alles Weitere steht hier.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Assets sind über den Dateinamen versioniert -> lange cachen
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML immer frisch prüfen
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Admin nicht indexieren lassen
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
